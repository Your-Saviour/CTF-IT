id: flask_defacement
name: Defaced Flask Homepage
description: The Flask app homepage has been defaced with attacker content. Remove the defacement.
type: vulnerability
difficulty: medium
supported_bases: [ubuntu_24_server]
points: 200
category: web
tags: [web, defacement, flask]
conflicts: []
requires: [vulnerable_flask_app]
script: deface_flask.sh
verification:
  type: http_response
  label: localhost_5000
  status_code: 200
  body_not_contains: "HACKED BY"
hints:
  - "Check the web app response at port 5000"
  - "Look at the Flask app source files in /opt/flaskapp"
suggested_fix: "Edit /opt/flaskapp/app.py to remove the defacement, then restart the flaskapp service"
caldera:
  tactic: impact
  technique:
    attack_id: T1491.002
    name: "Defacement: External Defacement"
  recon:
    description: "Check if Flask app homepage is defaced"
    command: |
      curl -s http://localhost:5000/ | grep -q "HACKED BY" && echo "VULNERABLE: homepage defaced" || echo "SECURE: homepage intact"
  exploit:
    description: "Confirm web defacement and extract attacker content"
    command: |
      curl -s http://localhost:5000/ | grep -i "HACKED"

references:
  - title: "OWASP Web Security Testing Guide"
    url: https://owasp.org/www-project-web-security-testing-guide/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
