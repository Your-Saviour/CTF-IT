id: inventory_secret_key
name: Hardcoded Secret Key
description: The inventory dashboard uses a hardcoded secret key, making session cookies forgeable. Replace it with a secure random value.
type: vulnerability
difficulty: easy
points: 100
category: web
tags: [web, secrets, flask]
conflicts: []
requires: [inventory_dashboard]
script: inventory_secret_key.sh
verification:
  type: file_not_contains
  path: /opt/inventory/app.py
  pattern: "changeme"
hints:
  - "Examine the Flask application source code for security misconfigurations"
  - "Look at how the app's secret key is set in /opt/inventory/app.py"
  - "Replace the weak secret key with a strong random value"
suggested_fix: "sed -i \"s/app.secret_key = \\\"changeme\\\"/app.secret_key = \\\"$(python3 -c 'import os; print(os.urandom(24).hex())')\\\"/\" /opt/inventory/app.py && systemctl restart inventory"
caldera:
  tactic: credential-access
  technique:
    attack_id: T1528
    name: "Steal Application Access Token"
  recon:
    description: "Check if Flask app uses hardcoded secret key"
    command: |
      grep -q 'changeme' /opt/inventory/app.py 2>/dev/null && echo "VULNERABLE: hardcoded secret key found" || echo "SECURE: secret key appears randomized"
  exploit:
    description: "Extract hardcoded Flask secret key for session forgery"
    command: |
      grep 'secret_key' /opt/inventory/app.py

references:
  - title: "OWASP Web Security Testing Guide"
    url: https://owasp.org/www-project-web-security-testing-guide/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
