id: inventory_backup_file
name: Exposed Database Backup
description: A backup of the inventory database is sitting in the application directory with sensitive data. Remove it or move it to a secure location.
type: vulnerability
difficulty: easy
points: 100
category: web
tags: [web, backup, data-exposure]
conflicts: []
requires: [inventory_dashboard]
script: inventory_backup_file.sh
verification:
  type: file_not_contains
  path: /opt/inventory/inventory.db.bak
  pattern: "SENSITIVE_BACKUP_DATA"
hints:
  - "Look for backup files in the application directory"
  - "Check for .bak files in /opt/inventory/"
  - "Delete the backup file: rm /opt/inventory/inventory.db.bak"
suggested_fix: "rm /opt/inventory/inventory.db.bak"
caldera:
  tactic: collection
  technique:
    attack_id: T1005
    name: "Data from Local System"
  recon:
    description: "Check if exposed database backup file exists"
    command: |
      test -f /opt/inventory/inventory.db.bak && echo "VULNERABLE: database backup file exposed" || echo "SECURE: no backup file found"
  exploit:
    description: "Exfiltrate exposed database backup"
    command: |
      sqlite3 /opt/inventory/inventory.db.bak ".tables" 2>/dev/null && sqlite3 /opt/inventory/inventory.db.bak "SELECT * FROM users LIMIT 5;" 2>/dev/null

references:
  - title: "OWASP Web Security Testing Guide"
    url: https://owasp.org/www-project-web-security-testing-guide/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
