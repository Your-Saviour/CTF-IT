id: guestbook_xss
name: Stored XSS in Guestbook
description: The guestbook accepts and stores user-supplied HTML without sanitisation. Messages containing <script> tags are stored in messages.txt and executed in any visitor's browser.
type: vulnerability
difficulty: medium
points: 200
category: web
tags: [xss, web, php, input-validation]
conflicts: []
requires: [php_guestbook]
script: guestbook_xss.sh
verification:
  type: all_of
  checks:
    - type: http_response
      method: POST
      port: 8080
      path: /
      status_code: 302
      form:
        name: verification-user
        message: "<script>window.ctfVerification=1</script>"
    - type: http_response
      port: 8080
      path: /
      status_code: 200
      body_not_contains: "<script>window.ctfVerification=1</script>"
    - type: http_response
      port: 8080
      path: /
      body_contains: "&lt;script&gt;window.ctfVerification=1&lt;/script&gt;"
suggested_fix: "Encode every stored name and message at output with htmlspecialchars(..., ENT_QUOTES, 'UTF-8'), remove the planted entry, and keep posting and viewing legitimate messages working."
hints:
  - "Review how user input is stored and displayed on the guestbook page"
  - "Check /opt/guestbook/messages.txt for raw HTML content"
  - "Restore contextual HTML encoding in /opt/guestbook/index.php, remove the planted entry, and test with a fresh script-tag message"

references:
  - title: "OWASP Web Security Testing Guide"
    url: https://owasp.org/www-project-web-security-testing-guide/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
