id: authentication_log_investigation
name: Authentication Log Investigation
description: Attribute a simulated password-spray sequence in the authentication log and preserve a concise incident finding.
type: payload
difficulty: medium
supported_bases: [ubuntu_24_server]
points: 200
category: incident-response
tags: [authentication, logs, investigation]
conflicts: []
requires: []
script: setup.sh
verification:
  type: all_of
  checks:
    - type: file_contains
      path: /root/incident-findings/authentication-spray.txt
      pattern: "source=198.51.100.24"
    - type: file_contains
      path: /root/incident-findings/authentication-spray.txt
      pattern: "target=backupsvc"
hints: [Search authentication failures for repeated sources and usernames., Correlate the planted Aug 12 sshd entries., Record source=198.51.100.24 and target=backupsvc in the finding file.]
learning_objectives: [Correlate authentication failures into an incident finding, Preserve evidence without storing credentials]
estimated_minutes: 35
debrief:
  root_cause: Repeated SSH authentication failures from one source targeted a service account.
  remediation: Document the source and target, then use the evidence to drive access control and credential response.
  attack_mapping: T1110.003 — Password Spraying
suggested_fix: Record the source and target as key-value lines in /root/incident-findings/authentication-spray.txt.

references:
  - title: "Ubuntu OpenSSH server documentation"
    url: https://documentation.ubuntu.com/server/how-to/security/openssh-server/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
