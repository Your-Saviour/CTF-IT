id: install_c2
name: Install C2 Beacon
description: Install a persistent command-and-control beacon that survives reboots, demonstrating full compromise of the target system.
type: goal
difficulty: hard
supported_bases: [ubuntu_24_server]
points: 0
red_points: 500
defend_points: 350
category: command-and-control
tags: [c2, persistence, command-and-control]
conflicts: []
requires: [nopasswd_sudo]

caldera:
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: "Remote Access Software"
  exploit:
    description: "Install a persistent beacon via systemd service"
    requirements:
      - source: ctf.vuln.nopasswd_sudo
    command: |
      [ -n "#{ctf.vuln.nopasswd_sudo}" ] || { echo "SKIPPED: passwordless sudo not confirmed"; exit 0; }
      sudo bash ./install_c2.sh
    payloads:
      - install_c2.sh

verification:
  type: service_running
  service: sysmon-helper
  expected: active

revert_verification:
  type: service_running
  service: sysmon-helper
  expected: inactive

references:
  - title: "Ubuntu Server security documentation"
    url: https://documentation.ubuntu.com/server/explanation/security/intro-to-security/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
