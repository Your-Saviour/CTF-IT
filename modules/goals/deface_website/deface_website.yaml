id: deface_website
name: Deface Website
description: Replace the target web application homepage with attacker content, demonstrating successful exploitation of the web stack.
type: goal
difficulty: medium
supported_bases: [ubuntu_24_server]
points: 0
red_points: 300
defend_points: 200
category: impact
tags: [web, defacement, impact]
conflicts: []
requires: [vulnerable_flask_app]

caldera:
  tactic: impact
  technique:
    attack_id: T1491.001
    name: "Defacement: Internal Defacement"
  exploit:
    description: "Replace web app homepage with attacker defacement content"
    command: |
      printf 'from flask import Flask\napp = Flask(__name__)\n\n@app.route("/")\ndef index():\n    return "<h1>HACKED BY RED TEAM</h1><p>This system has been compromised.</p>"\n\n@app.route("/admin")\ndef admin():\n    return "<h1>Admin Panel</h1><p>Nothing to see here.</p>"\n' > /opt/flaskapp/app.py
      systemctl restart flaskapp && echo "GOAL_ACHIEVED: website defaced"

verification:
  type: http_response
  label: localhost_5000
  body_contains: "HACKED BY RED TEAM"

revert_verification:
  type: http_response
  label: localhost_5000
  body_not_contains: "HACKED BY RED TEAM"

references:
  - title: "OWASP Web Security Testing Guide"
    url: https://owasp.org/www-project-web-security-testing-guide/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
