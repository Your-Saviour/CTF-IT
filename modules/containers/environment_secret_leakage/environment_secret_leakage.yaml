id: environment_secret_leakage
name: Container Environment Secret Leakage
description: Remove a plaintext API credential from a container environment file and migrate the workload to a root-readable secret file.
type: vulnerability
difficulty: medium
points: 200
category: containers
tags: [docker, secrets, environment, investigation]
conflicts: []
requires: [docker_service_lab]
script: setup.sh
verification:
  type: all_of
  checks:
    - type: file_not_contains
      path: /opt/container-lab/service.env
      pattern: "BACKUP_API_TOKEN="
    - type: file_permissions
      path: /opt/container-lab/secrets/backup_api_token
      mode: "600"
hints: [Inspect environment files and container configuration for credential material., Move BACKUP_API_TOKEN out of service.env., Store the rotated value in the declared secret file with mode 0600.]
learning_objectives: [Recognize environment-variable secret exposure, Migrate sensitive configuration to a constrained secret file]
estimated_minutes: 45
debrief:
  root_cause: A long-lived credential was readable through environment files and container inspection.
  remediation: Rotate the credential, remove it from environment configuration, and mount a tightly permissioned secret.
  attack_mapping: T1552.001 — Credentials In Files
suggested_fix: Remove BACKUP_API_TOKEN from service.env, rotate it, and store the new value in /opt/container-lab/secrets/backup_api_token with mode 0600.
