id: weak_ssh_credentials
name: Weak SSH Credentials
description: A service account (svc-monitor) exists with a guessable password, providing Caldera an initial foothold via SSH brute force.
type: vulnerability
stage: caldera
difficulty: easy
supported_bases: [ubuntu_24_server]
points: 0
category: authentication
tags: [ssh, credentials, initial-access, brute-force]
conflicts: []
requires: []
script: weak_ssh_credentials.sh

# Blue team never sees this — stage: caldera hides it from the dashboard.
# Verification is defined for completeness but is not scored.
verification:
  type: user_not_exists
  user: svc-monitor

caldera:
  tactic: initial-access
  technique:
    attack_id: T1110.001
    name: "Brute Force: Password Guessing"
  recon:
    description: "Discover the weak-credential account"
    parser:
      - module: plugins.ctf-exploit.app.parsers.ctf_extract
        mappings:
          - source: ctf.vuln.weak_ssh_credentials
            custom_parser_vals:
              marker: VULNERABLE
              pattern: "user=(\\S+)"
    command: |
      id svc-monitor >/dev/null 2>&1 && echo "VULNERABLE user=svc-monitor" || echo "SECURE: account not found"
  exploit:
    description: "Authenticate using the discovered weak account to establish a foothold"
    outputs:
      - trait: ctf.weak_ssh_credentials.shell
        marker: FOOTHOLD
    command: |
      USER="#{ctf.vuln.weak_ssh_credentials}"
      su -c "id && echo FOOTHOLD" "$USER"

references:
  - title: "Ubuntu OpenSSH server documentation"
    url: https://documentation.ubuntu.com/server/how-to/security/openssh-server/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
