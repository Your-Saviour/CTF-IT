id: writable_cron_script
name: World-writable cron script
description: A maintenance script executed by root's crontab is world-writable, allowing any user to inject commands that run as root.
type: vulnerability
difficulty: medium
supported_bases: [ubuntu_24_server]
points: 200
category: filesystem
tags: [cron, permissions, privilege-escalation]
conflicts: []
requires: []
script: writable_cron_script.sh
verification:
  type: file_permissions
  path: /opt/maintenance.sh
  expected: "750"
suggested_fix: "chmod 750 /opt/maintenance.sh"
hints:
  - "Examine scheduled tasks and the scripts they execute"
  - "Check crontab entries with: crontab -l && ls -la /etc/cron.*"
  - "Look for scripts with overly permissive write access"
caldera:
  tactic: privilege-escalation
  technique:
    attack_id: T1053.003
    name: "Scheduled Task/Job: Cron"
  recon:
    description: "Check for world-writable cron scripts"
    command: |
      test -w /opt/maintenance.sh && echo "VULNERABLE: cron script is world-writable" || echo "SECURE: cron script has correct permissions"
  exploit:
    description: "Inject command into world-writable cron script"
    command: |
      ls -la /opt/maintenance.sh && stat -c '%a' /opt/maintenance.sh

references:
  - title: "Ubuntu Server security documentation"
    url: https://documentation.ubuntu.com/server/explanation/security/intro-to-security/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
