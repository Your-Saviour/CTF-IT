id: nopasswd_sudo
name: NOPASSWD sudo entry
description: A sudoers drop-in file grants a user unrestricted passwordless sudo access, allowing full privilege escalation without authentication.
type: vulnerability
difficulty: medium
points: 200
category: authentication
tags: [sudo, privilege-escalation, misconfiguration]
conflicts: []
requires: []
script: nopasswd_sudo.sh
verification:
  type: file_not_contains
  path: /etc/sudoers.d/backdoor
  pattern: "NOPASSWD"
  expected: true
suggested_fix: "rm /etc/sudoers.d/backdoor"
hints:
  - "Check what sudo privileges are configured on the system"
  - "Look at files in /etc/sudoers.d/ for suspicious entries"
  - "Remove or fix any sudoers rules that bypass password requirements"
caldera:
  tactic: privilege-escalation
  technique:
    attack_id: T1548.003
    name: "Abuse Elevation Control Mechanism: Sudo and Sudo Caching"
  recon:
    description: "Check for NOPASSWD sudo entries"
    command: |
      grep -r NOPASSWD /etc/sudoers.d/ 2>/dev/null && echo "VULNERABLE: NOPASSWD sudo entry found" || echo "SECURE: no NOPASSWD entries"
  exploit:
    description: "Use NOPASSWD sudo to read sensitive files as root"
    command: |
      sudo -n cat /etc/shadow 2>/dev/null | head -3

references:
  - title: "Ubuntu Server security documentation"
    url: https://documentation.ubuntu.com/server/explanation/security/intro-to-security/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
