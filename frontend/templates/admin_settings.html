{% extends "admin_base.html" %}
{% block page_actions %}<button class="btn btn-primary" data-drawer-open="credential-drawer">Add credential</button>{% endblock %}
{% block admin_content %}<section class="admin-card"><div id="credentials" class="empty-state">Loading credentials…</div></section><div class="drawer-backdrop" id="credential-drawer" role="dialog" aria-modal="true" aria-labelledby="credential-title"><div class="side-drawer"><div class="drawer-header"><h2 id="credential-title">Add credential</h2><button class="icon-button close-button" data-drawer-close aria-label="Close"><span aria-hidden="true"></span></button></div><form id="credential-form"><label>Service name<input name="service_name" required></label><label>Type<select name="credential_type"><option>admin</option><option>token</option></select></label><label>Username<input name="username"></label><label>Secret<input name="password" type="password" required></label><label>URL<input name="url" type="url"></label><button class="btn btn-primary" type="submit">Save credential</button></form></div></div>{% endblock %}
{% block admin_script %}<script>
const credEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadCredentials(){let r=await fetch('/admin/api/credentials');let d=await r.json();document.getElementById('credentials').innerHTML=d.length?d.map(c=>`<div class="admin-card" style="margin-bottom:.75rem"><h2>${credEsc(c.service_name)}</h2><p>${credEsc(c.username||'No username')} · ${credEsc(c.masked_secret||'No secret')}</p><button class="icon-button" onclick="reveal(${c.id},this)">Reveal / copy</button> ${c.url?`<a href="${credEsc(c.url)}" target="_blank" rel="noopener">Open service</a>`:''}</div>`).join(''):'<div class="empty-state">No credentials configured.</div>'}
async function reveal(id,button){let r=await fetch(`/admin/api/credentials/${id}/reveal`,{method:'POST'});let d=await r.json();if(!r.ok)return showToast(d.error||'Reveal failed');button.textContent=d.secret;try{await navigator.clipboard.writeText(d.secret);showToast('Secret copied')}catch(e){showToast('Secret revealed')}}
document.getElementById('credential-form').addEventListener('submit',async e=>{e.preventDefault();let body=Object.fromEntries(new FormData(e.target));let r=await fetch('/admin/api/credentials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){document.getElementById('credential-drawer').classList.remove('open');e.target.reset();loadCredentials()}});loadCredentials();
</script>{% endblock %}
