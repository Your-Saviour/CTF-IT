services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "${API_PORT:-8080}:8000"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - api_data:/app/data
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///data/ctf.db
      - COOKIE_SECURE=false
      - AGENT_API_URL=http://ai-agent:8000/api/agent
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - VERIFICATION_INTERVAL_SECONDS=${VERIFICATION_INTERVAL_SECONDS:-300}
      - VERIFICATION_VM_CONCURRENCY=${VERIFICATION_VM_CONCURRENCY:-5}
      - VERIFICATION_TIMEOUT_SECONDS=${VERIFICATION_TIMEOUT_SECONDS:-10}
      - EXPO_IT_URL=${EXPO_IT_URL:-}
      - EXPO_IT_API_KEY=${EXPO_IT_API_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - AWS_ENVIRONMENT=${AWS_ENVIRONMENT:-}
      - AWS_STANDARD_VPC_ID=${AWS_STANDARD_VPC_ID:-}
      - AWS_STANDARD_SUBNET_ID=${AWS_STANDARD_SUBNET_ID:-}
      - AWS_STANDARD_SECURITY_GROUP_IDS=${AWS_STANDARD_SECURITY_GROUP_IDS:-}
      - AWS_UBUNTU_AMIS=${AWS_UBUNTU_AMIS:-}
      - AWS_FREEBSD_AMIS=${AWS_FREEBSD_AMIS:-}
      - AWS_AVAILABILITY_ZONES=${AWS_AVAILABILITY_ZONES:-}
      - AWS_INSTANCE_TYPES=${AWS_INSTANCE_TYPES:-}
      - AWS_KEY_PAIR_NAME=${AWS_KEY_PAIR_NAME:-ctf-it}
    restart: unless-stopped

  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    volumes:
      - agent_data:/app/data
    environment:
      - AGENT_DATABASE_URL=sqlite:///data/agent.db
      - CTF_API_URL=http://api:8000
      - CTF_API_KEY=${CTF_API_KEY:-}
      - CALDERA_INTERNAL_URL=${CALDERA_INTERNAL_URL:-http://ctf-caldera:8888}
      - CALDERA_CONFIG_PATH=${CALDERA_CONFIG_PATH:-/caldera-config/local.yml}
      - AI_API_BASE=${AI_API_BASE:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_MAX_STEPS=${AGENT_MAX_STEPS:-100}
      - AGENT_STEP_TIMEOUT=${AGENT_STEP_TIMEOUT:-120}
      - AGENT_APPROVAL_REQUIRED=${AGENT_APPROVAL_REQUIRED:-true}
      - AGENT_AUTO_STEP=${AGENT_AUTO_STEP:-false}
      - AGENT_AUTO_STEP_INTERVAL=${AGENT_AUTO_STEP_INTERVAL:-30}
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED:-true}
      - WEBSOCKET_HEARTBEAT_INTERVAL=${WEBSOCKET_HEARTBEAT_INTERVAL:-30}
      - MAX_ERROR_HISTORY=${MAX_ERROR_HISTORY:-50}
      - ERROR_DISPLAY_DURATION=${ERROR_DISPLAY_DURATION:-300}
      - AUTO_RETRY_FAILED_OPS=${AUTO_RETRY_FAILED_OPS:-false}
    restart: unless-stopped
    profiles: ["ai-agent"]

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    env_file: .env
    environment:
      - AGENT_DATABASE_URL=sqlite://
      - COOKIE_SECURE=false

  aws-tools:
    image: public.ecr.aws/aws-cli/aws-cli:2.36.24
    profiles: ["aws-acceptance"]
    volumes:
      - aws_credentials:/root/.aws
    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-2}
    command: ["--version"]

  aws-acceptance:
    profiles: ["aws-acceptance"]
    build:
      context: .
      target: acceptance
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - aws_credentials:/root/.aws
      - opnsense_source_cache:/var/cache/opnsense:ro
    environment:
      - SECRET_KEY=aws-acceptance-container-only
      - DATA_ENCRYPTION_KEY=aws-acceptance-data-container-only
      - AWS_PROFILE=${AWS_PROFILE:-ctf-it-acceptance}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-2}
      - AWS_ENVIRONMENT=${AWS_ENVIRONMENT:-}
      - AWS_STANDARD_VPC_ID=${AWS_STANDARD_VPC_ID:-}
      - AWS_STANDARD_SUBNET_ID=${AWS_STANDARD_SUBNET_ID:-}
      - AWS_STANDARD_SECURITY_GROUP_IDS=${AWS_STANDARD_SECURITY_GROUP_IDS:-}
      - AWS_UBUNTU_AMIS=${AWS_UBUNTU_AMIS:-}
      - AWS_FREEBSD_AMIS=${AWS_FREEBSD_AMIS:-}
      - AWS_AVAILABILITY_ZONES=${AWS_AVAILABILITY_ZONES:-}
      - AWS_INSTANCE_TYPES=${AWS_INSTANCE_TYPES:-}
      - AWS_KEY_PAIR_NAME=${AWS_KEY_PAIR_NAME:-ctf-it}
      - CTF_CONTROL_PLANE_CIDR=${CTF_CONTROL_PLANE_CIDR:-}
      - RUN_AWS_ACCEPTANCE=${RUN_AWS_ACCEPTANCE:-}
      - AWS_ACCEPTANCE_ACCOUNT_ID=${AWS_ACCEPTANCE_ACCOUNT_ID:-}
      - AWS_ACCEPTANCE_RUN_ID=${AWS_ACCEPTANCE_RUN_ID:-}
      - AWS_ACCEPTANCE_FORCE_OPNSENSE_BUILD=${AWS_ACCEPTANCE_FORCE_OPNSENSE_BUILD:-}
      - OPNSENSE_CORE_ARCHIVE=/var/cache/opnsense/core-26.7.tar.gz
      - OPNSENSE_CORE_COMMIT_FILE=/var/cache/opnsense/core-26.7.commit
    depends_on:
      opnsense-source-cache:
        condition: service_completed_successfully

  opnsense-source-cache:
    profiles: ["aws-acceptance"]
    image: alpine/git:2.49.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /cache/core-26.7.tar.gz ] || [ ! -s /cache/core-26.7.commit ]; then
          rm -rf /cache/core-repository /cache/core-26.7.tar.gz /cache/core-26.7.commit
          git clone --depth 1 --branch stable/26.7 https://github.com/opnsense/core.git /cache/core-repository
          git -C /cache/core-repository archive --format=tar.gz --prefix=core-stable-26.7/ -o /cache/core-26.7.tar.gz HEAD
          git -C /cache/core-repository rev-parse HEAD > /cache/core-26.7.commit
          rm -rf /cache/core-repository
        fi
    volumes:
      - opnsense_source_cache:/cache

  aws-opnsense-cache:
    profiles: ["aws-acceptance"]
    build:
      context: .
      target: acceptance
    volumes:
      - aws_credentials:/root/.aws
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-ctf-it-acceptance}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-2}
    entrypoint: ["python", "-m", "scripts.aws_acceptance_opnsense_cache"]
    command:
      - --expected-account-id
      - ${AWS_ACCEPTANCE_ACCOUNT_ID:-}
      - --inventory-only

volumes:
  api_data:
  aws_credentials:
  agent_data:
  opnsense_source_cache:
