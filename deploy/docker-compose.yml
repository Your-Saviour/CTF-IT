# CTF-IT Deployment Stack — Traefik + Dockhand + API + Caldera + Semaphore
# Prerequisites:
#   1. Copy .env.example to .env and fill in values (see generation commands inside)
#   2. Copy caldera/config/local.yml.example to caldera/config/local.yml and update secrets
#   3. (Optional) Export Caldera plugin from CTF admin and unzip into caldera/plugins/ctf-exploit/
#   4. Start: docker compose up -d
#
# Resource requirements: ~2GB RAM minimum
#   - Traefik: ~64MB
#   - Dockhand: ~64MB
#   - CTF API: ~128MB (Python + Docker client)
#   - Caldera: ~512MB (Python + plugins)
#   - Semaphore: ~128MB (Go binary)
#   - Semaphore Postgres: ~128MB
#
# Notes:
#   - Domain is configured via DOMAIN in .env (e.g. DOMAIN=example.com)
#   - Services: ctf.DOMAIN, caldera.DOMAIN, semaphore.DOMAIN,
#     dockhand.DOMAIN, traefik.DOMAIN
#   - Caldera agent ports are published directly (cannot be reverse-proxied)
#   - Caldera export workflow: download zip from CTF admin panel, upload plugin to Caldera
#   - Ansible export workflow: download zip from CTF admin panel, create project in Semaphore
#   - The API uses a restricted Docker socket proxy to restart Caldera

services:

  # Narrow Docker API proxies keep the host socket out of routed containers.
  traefik-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      SERVICES: 1
      TASKS: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ctf-internal]

  api-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ctf-internal]

  dockhand-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      DELETE: 1
      EVENTS: 1
      EXEC: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      POST: 1
      VERSION: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ctf-internal]

  # ─── Traefik — Reverse Proxy ────────────────────────────────────────────────
  traefik:
    image: traefik@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    container_name: ctf-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Please set ACME_EMAIL in your .env file}
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ctf-letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/ping || exit 1"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ctf-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.ctf-dashboard.entrypoints=websecure"
      - "traefik.http.routers.ctf-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ctf-dashboard.service=api@internal"
      - "traefik.http.routers.ctf-dashboard.middlewares=ctf-dashboard-auth"
      - "traefik.http.middlewares.ctf-dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:?Please set TRAEFIK_DASHBOARD_AUTH in your .env file}"
    networks:
      - ctf-proxy
      - ctf-internal
    depends_on:
      - traefik-docker-proxy

  # ─── Dockhand — Container Management UI ────────────────────────────────────
  dockhand:
    image: fnsys/dockhand@sha256:29d4183d8aef2cc7fbc50750fa11434ec331e044647288ae47fe15260e68a44c
    container_name: ctf-dockhand
    restart: unless-stopped
    volumes:
      - ctf-dockhand_data:/app/data
    environment:
      DOCKER_HOST: tcp://dockhand-docker-proxy:2375
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ctf-dockhand.rule=Host(`dockhand.${DOMAIN}`)"
      - "traefik.http.routers.ctf-dockhand.entrypoints=websecure"
      - "traefik.http.routers.ctf-dockhand.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ctf-dockhand.middlewares=ctf-dashboard-auth@docker"
      - "traefik.http.services.ctf-dockhand.loadbalancer.server.port=3000"
    depends_on:
      traefik:
        condition: service_healthy
      dockhand-docker-proxy:
        condition: service_started
    networks:
      - ctf-proxy
      - ctf-internal

  # ─── CTF API — FastAPI Application ─────────────────────────────────────────
  api-postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: ctf-api-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ctf -U ctf"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ctf-api_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ctf
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ${CTF_POSTGRES_PASSWORD:?Please set CTF_POSTGRES_PASSWORD in your .env file}
    networks: [ctf-internal]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    container_name: ctf-api
    restart: unless-stopped
    volumes:
      # Caldera integration: allows the API to install the exported plugin and update config
      - ./caldera/plugins/ctf-exploit:/caldera-plugin/ctf-exploit
      - ./caldera/config/local.yml:/caldera-config/local.yml
      # Shared playbooks: API writes playbook files here; Semaphore reads them
      - ctf-shared_playbooks:/shared/playbooks
    env_file: ../.env
    environment:
      - DATABASE_URL=postgresql+psycopg://ctf:${CTF_POSTGRES_PASSWORD}@api-postgres:5432/ctf
      - DOCKER_HOST=tcp://api-docker-proxy:2375
      - COOKIE_SECURE=true
      - DOMAIN=${DOMAIN}
      # Semaphore integration for automated VM provisioning
      - SEMAPHORE_URL=http://ctf-semaphore:3000
      - SEMAPHORE_ADMIN=${SEMAPHORE_ADMIN:-admin}
      - SEMAPHORE_ADMIN_PASSWORD=${SEMAPHORE_ADMIN_PASSWORD}
      - SHARED_PLAYBOOK_DIR=/shared/playbooks
      # External address Caldera agents use to beacon back (set to server's public IP/domain)
      - CALDERA_AGENT_URL=${CALDERA_AGENT_URL:-http://localhost:8888}
      - CALDERA_INTERNAL_URL=http://caldera:8888
      - AGENT_API_URL=http://ai-agent:8000/api/agent
      - LEARNER_TRAINING_ENABLED=${LEARNER_TRAINING_ENABLED:-false}
      - VERIFICATION_INTERVAL_SECONDS=${VERIFICATION_INTERVAL_SECONDS:-300}
      - VERIFICATION_VM_CONCURRENCY=${VERIFICATION_VM_CONCURRENCY:-5}
      - VERIFICATION_TIMEOUT_SECONDS=${VERIFICATION_TIMEOUT_SECONDS:-10}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ctf-api.rule=Host(`ctf.${DOMAIN}`)"
      - "traefik.http.routers.ctf-api.entrypoints=websecure"
      - "traefik.http.routers.ctf-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.ctf-api.loadbalancer.server.port=8000"
    networks:
      - ctf-proxy
      - ctf-internal
    depends_on:
      api-docker-proxy:
        condition: service_started
      api-postgres:
        condition: service_healthy
      semaphore:
        condition: service_healthy
      caldera:
        condition: service_healthy

  # ─── MITRE Caldera — Adversary Emulation ───────────────────────────────────
  caldera:
    # Caldera does not publish an official GHCR image. Build the supported
    # upstream Dockerfile from the immutable commit behind release 5.3.0.
    build:
      context: https://github.com/apache/caldera.git#${CALDERA_REF:-b24f6e7a99cab19cbf417009bda9b9c6c81abc31}
      dockerfile: Dockerfile
      args:
        TZ: UTC
        VARIANT: full
    image: ctf-caldera:${CALDERA_IMAGE_TAG:-5.3.0}
    container_name: ctf-caldera
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888')\""]
      start_period: 90s
      interval: 30s
      retries: 5
      timeout: 10s
    volumes:
      - ./caldera/config/local.yml:/usr/src/app/conf/local.yml:ro
      - ./caldera/config/ssh_host_key:/usr/src/app/conf/ssh_host_key:ro
      - ctf-caldera_data:/usr/src/app/data
      # Mount exported CTF plugin — unzip caldera export into caldera/plugins/ctf-exploit/
      - ./caldera/plugins/ctf-exploit:/usr/src/app/plugins/ctf-exploit:ro
    ports:
      # Agent communication ports — cannot be reverse-proxied.
      # Agents connect directly to the host on these ports for C2 communication.
      - "7010:7010"       # TCP (Sandcat)
      - "7011:7011/udp"   # UDP
      - "7012:7012"       # WebSocket (Manx)
      - "8022:8022"       # SSH tunnel
      - "2222:2222"       # FTP
      - "8853:8853"       # DNS
      - "8888:8888"       # HTTP C2 (agents beacon here directly)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ctf-caldera.rule=Host(`caldera.${DOMAIN}`)"
      - "traefik.http.routers.ctf-caldera.entrypoints=websecure"
      - "traefik.http.routers.ctf-caldera.tls.certresolver=letsencrypt"
      - "traefik.http.services.ctf-caldera.loadbalancer.server.port=8888"
    networks:
      - ctf-proxy
      - ctf-internal

  # ─── Semaphore Postgres — Database for Semaphore ───────────────────────────
  semaphore-postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: ctf-semaphore-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d semaphore -U semaphore"]
      start_period: 15s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ctf-semaphore_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: semaphore
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: ${SEMAPHORE_POSTGRES_PASSWORD:?Please set SEMAPHORE_POSTGRES_PASSWORD in your .env file}
    networks:
      - ctf-internal

  # ─── Ansible Semaphore — Playbook Execution UI ─────────────────────────────
  semaphore:
    image: semaphoreui/semaphore@sha256:7c7504614c4795b0e0670fb2d4400d35e2302204609664943cb16308b7a6f1e4
    container_name: ctf-semaphore
    restart: unless-stopped
    depends_on:
      semaphore-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: ctf-semaphore-postgres
      SEMAPHORE_DB_PORT: 5432
      SEMAPHORE_DB_NAME: semaphore
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: ${SEMAPHORE_POSTGRES_PASSWORD:?Please set SEMAPHORE_POSTGRES_PASSWORD in your .env file}
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN:-admin}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:?Please set SEMAPHORE_ADMIN_PASSWORD in your .env file}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-Admin}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@example.com}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:?Please set SEMAPHORE_ACCESS_KEY_ENCRYPTION in your .env file}
      # Vultr API key — needed by create-vm.yml / destroy-vm.yml playbooks
      VULTR_API_KEY: ${VULTR_API_KEY:-}
    volumes:
      - ctf-semaphore_data:/var/lib/semaphore
      # Shared playbooks: Semaphore reads playbook files staged here by the CTF API
      - ctf-shared_playbooks:/shared/playbooks:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ctf-semaphore.rule=Host(`semaphore.${DOMAIN}`)"
      - "traefik.http.routers.ctf-semaphore.entrypoints=websecure"
      - "traefik.http.routers.ctf-semaphore.tls.certresolver=letsencrypt"
      - "traefik.http.services.ctf-semaphore.loadbalancer.server.port=3000"
    networks:
      - ctf-proxy
      - ctf-internal

  # ─── AI Red Team Agent — Autonomous pentesting agent ──────────────────────
  ai-agent:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    container_name: ctf-ai-agent
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ctf-ai-agent_data:/app/data
      - ctf-shared_playbooks:/shared/playbooks:ro
      - ./caldera/config/local.yml:/caldera-config/local.yml:ro
    environment:
      - CTF_API_URL=http://api:8000
      - CALDERA_INTERNAL_URL=http://caldera:8888
      - CALDERA_CONFIG_PATH=/caldera-config/local.yml
      - AGENT_MAX_STEPS=100
      - AGENT_APPROVAL_REQUIRED=true
      - AGENT_AUTO_STEP=false
      - AGENT_DATABASE_URL=sqlite:///data/agent.db
    depends_on:
      api:
        condition: service_healthy
      caldera:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - ctf-proxy
      - ctf-internal

volumes:
  ctf-letsencrypt:
  ctf-dockhand_data:
  ctf-api_postgres_data:
  ctf-caldera_data:
  ctf-semaphore_postgres_data:
  ctf-semaphore_data:
  ctf-shared_playbooks:
  ctf-ai-agent_data:

networks:
  ctf-proxy:
    name: ctf-proxy
  ctf-internal:
    internal: true
