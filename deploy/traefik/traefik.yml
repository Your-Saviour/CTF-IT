api:
  dashboard: true

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      # email is set via --certificatesresolvers.letsencrypt.acme.email in docker-compose.yml
      # sourced from ACME_EMAIL in deploy/.env
      storage: /letsencrypt/acme.json
      tlsChallenge: {}

providers:
  docker:
    endpoint: tcp://traefik-docker-proxy:2375
    exposedByDefault: false
    network: ctf-proxy
