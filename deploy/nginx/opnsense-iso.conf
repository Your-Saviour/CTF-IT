server {
    listen 8080;
    server_name _;
    autoindex off;
    server_tokens off;

    location /vultr-iso/ {
        alias /srv/opnsense/public/;
        limit_except GET { deny all; }
        types { application/octet-stream iso bz2; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / { return 404; }
}
