---
# Create a Vultr VPS and optionally register a Cloudflare DNS A record.
#
# Required extra vars (passed via Semaphore template arguments):
#   vm_hostname     - instance label and hostname (e.g. "target-01")
#   vm_plan         - Vultr plan ID (e.g. "vc2-1c-1gb")
#   vm_os           - Vultr OS name (e.g. "Ubuntu 24.04 LTS x64")
#   vm_region       - Vultr region code (e.g. "ewr")
#   ssh_key_name    - Name to register the SSH key under in Vultr
#   ssh_public_key  - Ed25519 public key content to inject into the VM
#
# Optional extra vars:
#   domain_name         - Domain for DNS A record (e.g. "example.com")
#   cloudflare_api_key  - Cloudflare API token with Zone:DNS:Edit permissions
#
# Environment (must be set in the Semaphore container):
#   VULTR_API_KEY   - Vultr API key

- name: Create Vultr VM
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    VULTR_API_KEY: "{{ lookup('env', 'VULTR_API_KEY') }}"

  tasks:

    - name: Register SSH public key with Vultr (idempotent)
      vultr.cloud.ssh_key:
        name: "{{ ssh_key_name }}"
        ssh_key: "{{ ssh_public_key }}"
        state: present

    - name: Create Vultr instance
      vultr.cloud.instance:
        label: "{{ vm_hostname }}"
        hostname: "{{ vm_hostname }}"
        plan: "{{ vm_plan }}"
        os: "{{ vm_os }}"
        region: "{{ vm_region }}"
        ssh_keys:
          - "{{ ssh_key_name }}"
        ddos_protection: false
        backups: false
        enable_ipv6: false
        state: present
      register: vultr_instance

    - name: Create Cloudflare DNS A record
      community.general.cloudflare_dns:
        zone: "{{ domain_name }}"
        record: "{{ vm_hostname }}"
        type: A
        value: "{{ vultr_instance.vultr_instance.main_ip }}"
        api_token: "{{ cloudflare_api_key }}"
        solo: true
      register: dns_result
      when:
        - domain_name is defined
        - domain_name | length > 0
        - cloudflare_api_key is defined
        - cloudflare_api_key | length > 0

    - name: Output instance details for CTF-IT
      ansible.builtin.debug:
        msg: >-
          VULTR_RESULT={{ {
            'ip': vultr_instance.vultr_instance.main_ip,
            'vultr_id': vultr_instance.vultr_instance.id,
            'dns_record_id': (dns_result.result.id | default('')) if dns_result is not skipped else ''
          } | to_json }}
