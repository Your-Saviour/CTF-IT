---
# Destroy a Vultr VPS and remove its Cloudflare DNS A record.
#
# Required extra vars (passed via Semaphore template arguments):
#   instance_label   - Vultr instance label to destroy
#   instance_region  - Vultr region where the instance lives
#
# Optional extra vars:
#   dns_hostname        - Hostname record to delete (e.g. "target-01")
#   domain_name         - Domain for DNS (e.g. "example.com")
#   cloudflare_api_key  - Cloudflare API token
#
# Required extra vars (continued):
#   vultr_api_key   - Vultr API key

- name: Destroy Vultr VM
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    VULTR_API_KEY: "{{ vultr_api_key }}"

  tasks:

    - name: Delete Cloudflare DNS A record
      community.general.cloudflare_dns:
        zone: "{{ domain_name }}"
        record: "{{ dns_hostname }}"
        type: A
        api_token: "{{ cloudflare_api_key }}"
        state: absent
      when:
        - dns_hostname is defined
        - dns_hostname | length > 0
        - domain_name is defined
        - domain_name | length > 0
        - cloudflare_api_key is defined
        - cloudflare_api_key | length > 0

    - name: Destroy Vultr instance
      vultr.cloud.instance:
        label: "{{ instance_label }}"
        region: "{{ instance_region }}"
        state: absent
