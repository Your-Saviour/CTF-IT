---
# Bootstrap FreeBSD 14 into OPNsense 25.1.
# Expects a pre-computed admin password hash and SSH public key as extra vars.
# The config.xml is deployed BEFORE bootstrapping so OPNsense boots with SSH enabled.
#
# Required extra vars:
#   opnsense_hostname           - hostname to set in config.xml
#   opnsense_lan_ip             - LAN IP (e.g. "10.1.1.1")
#   opnsense_lan_subnet         - LAN subnet mask (e.g. 24)
#   opnsense_admin_password_hash - bcrypt hash of admin password
#   opnsense_ssh_pubkey         - SSH public key content (for authorized_keys)
#   opnsense_release            - OPNsense release version (e.g. "25.1")

- name: Bootstrap and Configure OPNsense
  hosts: all
  become: true
  # An interrupted conversion can remove Python before OPNsense is installed.
  # Keep the preflight Python-free so failures are reported by the actual
  # bootstrap checks, not Ansible's implicit fact-gathering step.
  gather_facts: false

  tasks:
    # =====================================================
    # Phase 1: Deploy config BEFORE bootstrap
    # =====================================================

    - name: Verify host is running FreeBSD
      ansible.builtin.raw: "test \"$(uname -s)\" = FreeBSD"
      changed_when: false

    - name: Ensure /conf directory exists
      ansible.builtin.file:
        path: /conf
        state: directory
        owner: root
        group: wheel
        mode: "0755"

    - name: Deploy OPNsense config.xml (before bootstrap)
      ansible.builtin.template:
        src: opnsense_config.xml.j2
        dest: /conf/config.xml
        owner: root
        group: wheel
        mode: "0644"

    - name: Ensure SSH authorized_keys directory exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: wheel
        mode: "0700"

    - name: Deploy SSH authorized_keys
      ansible.builtin.copy:
        content: "{{ opnsense_ssh_pubkey }}\n"
        dest: /root/.ssh/authorized_keys
        owner: root
        group: wheel
        mode: "0600"

    # =====================================================
    # Phase 2: Bootstrap FreeBSD → OPNsense
    # =====================================================

    - name: Download opnsense-bootstrap.sh
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/opnsense/update/{{ opnsense_release }}/src/bootstrap/opnsense-bootstrap.sh.in"
        dest: /tmp/opnsense-bootstrap.sh
        mode: "0755"

    - name: Start OPNsense bootstrap independently of the Ansible connection
      ansible.builtin.shell:
        # A normal Ansible async job is tied to its connection wrapper and can
        # be terminated while the installer reboots the host. nohup keeps the
        # conversion alive and records its output for diagnosis.
        cmd: >-
          nohup /tmp/opnsense-bootstrap.sh -r {{ opnsense_release }} -y
          >/var/log/opnsense-bootstrap.log 2>&1 &

    # =====================================================
    # Phase 3: Reconnect after reboot
    # =====================================================

    - name: Clear known_hosts entry (host key changes after OPNsense install)
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: Allow OPNsense conversion and reboot to complete
      ansible.builtin.pause:
        # Package installation plus the base archive download can exceed five
        # minutes on a small cloud VM. Do not run post-install commands while
        # the conversion is still replacing the underlying system.
        seconds: 900

    - name: Verify OPNsense is installed
      ansible.builtin.raw: "test -x /usr/local/sbin/configctl"
      changed_when: false

    - name: Pause for OPNsense services to initialize
      ansible.builtin.pause:
        seconds: 30

    # =====================================================
    # Phase 4: Post-boot configuration
    # =====================================================

    - name: Reload OPNsense configuration
      # OPNsense intentionally does not ship Python. `raw` executes over SSH
      # without the Python-based Ansible module runtime.
      ansible.builtin.raw: "configctl service reload all"
      changed_when: true

    - name: Restart OPNsense web UI
      ansible.builtin.raw: "configctl webgui restart"
      changed_when: true

    - name: Signal bootstrap complete
      ansible.builtin.debug:
        msg: "OPNSENSE_BOOTSTRAP_OK=true"
