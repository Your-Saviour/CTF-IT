---
# Configure an AWS secondary ENI on an Ubuntu endpoint.
# The interface is selected by its recorded EC2 MAC address, not a device name.
#
# Required extra vars:
#   vpc_ip          - Static IP to assign (e.g. "10.1.1.10")
#   vpc_subnet_mask - Subnet mask bits (e.g. 24)
#   vpc_gateway     - Default gateway on VPC (OPNsense LAN IP, e.g. "10.1.1.1")
#   vpc_mac         - MAC address reported for the EC2 ENI
#   vpc_mtu         - Optional interface MTU (default: 1500)

- name: Configure VPC Interface
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Validate recorded ENI MAC address
      ansible.builtin.assert:
        that:
          - vpc_mac is match('^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$')
        fail_msg: "vpc_mac must be the MAC address recorded for the AWS ENI"

    - name: Ensure netplan config directory exists
      ansible.builtin.file:
        path: /etc/netplan
        state: directory
        mode: "0755"

    - name: Deploy VPC netplan config
      ansible.builtin.template:
        src: vpc-netplan.yaml.j2
        dest: /etc/netplan/99-vpc.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Apply netplan configuration
      ansible.builtin.shell:
        cmd: netplan apply
      changed_when: true
